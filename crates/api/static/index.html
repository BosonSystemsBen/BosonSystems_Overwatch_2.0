<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overwatch — UI de test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1a1a1a; }
  header { background: #14213d; color: white; padding: 1rem 1.5rem; }
  header h1 { margin: 0; font-size: 1.1rem; }
  nav { display: flex; gap: 0.5rem; padding: 0.75rem 1.5rem; background: white; border-bottom: 1px solid #ddd; }
  nav button { padding: 0.5rem 1rem; border: none; background: none; cursor: pointer; font-size: 0.95rem; border-radius: 6px; }
  nav button.active { background: #14213d; color: white; }
  main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }
  table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 1.5rem; }
  th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  th { background: #fafafa; }
  form { background: white; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: end; }
  form label { display: flex; flex-direction: column; font-size: 0.8rem; color: #555; gap: 0.2rem; }
  input, select { padding: 0.4rem; border: 1px solid #ccc; border-radius: 5px; font-size: 0.9rem; }
  button { cursor: pointer; }
  button.primary { background: #14213d; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; }
  button.danger { background: #fee; color: #c00; border: 1px solid #fbb; border-radius: 5px; padding: 0.3rem 0.6rem; font-size: 0.8rem; }
  button.secondary { background: #eee; border: 1px solid #ccc; border-radius: 5px; padding: 0.3rem 0.6rem; font-size: 0.8rem; }
  .msg { padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
  .msg.error { background: #fee; color: #c00; }
  .msg.ok { background: #eafbea; color: #1a7a1a; }
  h2 { font-size: 1.1rem; }
  code { background: #eee; padding: 0.1rem 0.3rem; border-radius: 4px; font-size: 0.85rem; }
</style>
</head>
<body>

<header><h1>Overwatch — UI de test (locale, pas le dashboard final)</h1></header>
<nav>
  <button data-tab="products" class="active">Produits</button>
  <button data-tab="serials">Numéros de série</button>
  <button data-tab="shipments">Expéditions</button>
</nav>
<main>
  <div id="msg"></div>

  <section id="products" class="active">
    <h2>Produits (nomenclature)</h2>
    <form id="product-form">
      <label>SKU <input name="sku" required></label>
      <label>Nom <input name="name" required></label>
      <label>Requiert S/N <input name="requires_serial" type="checkbox"></label>
      <label>Motif de détection (regex) <input name="detection_pattern" placeholder="^PDU16-[0-9]{6}$"></label>
      <label>ID produit Pennylane <input name="pennylane_product_id" type="number"></label>
      <button class="primary" type="submit">Créer</button>
    </form>
    <table id="product-table"></table>
  </section>

  <section id="serials">
    <h2>Numéros de série</h2>
    <form id="detect-form">
      <label>Détecter un produit à partir d'un S/N <input name="value" placeholder="PDU16-000123"></label>
      <button class="secondary" type="submit">Détecter</button>
      <span id="detect-result"></span>
    </form>
    <form id="serial-form">
      <label>Produit <select name="product_id" id="serial-product-select"></select></label>
      <label>Valeur <input name="value" required></label>
      <button class="primary" type="submit">Créer</button>
    </form>
    <table id="serial-table"></table>
  </section>

  <section id="shipments">
    <h2>Expéditions</h2>
    <button class="primary" id="sync-btn">Synchroniser depuis Pennylane</button>
    <table id="shipment-table"></table>
    <div id="shipment-detail"></div>
  </section>
</main>

<script>
const msgEl = document.getElementById('msg');

function showMsg(text, kind) {
  msgEl.innerHTML = `<div class="msg ${kind}">${text}</div>`;
  setTimeout(() => { msgEl.innerHTML = ''; }, 5000);
}

async function api(path, options) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    throw new Error(data?.error || `HTTP ${res.status}`);
  }
  return data;
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('main section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

let products = [];

async function loadProducts() {
  products = await api('/products');
  const table = document.getElementById('product-table');
  table.innerHTML = `<tr><th>SKU</th><th>Nom</th><th>S/N requis</th><th>Motif</th><th>ID Pennylane</th><th></th></tr>` +
    products.map(p => `<tr>
      <td>${p.sku}</td><td>${p.name}</td><td>${p.requires_serial ? 'oui' : 'non'}</td>
      <td><code>${p.detection_pattern ?? ''}</code></td><td>${p.pennylane_product_id ?? ''}</td>
      <td><button class="danger" data-id="${p.id}" data-action="delete-product">Supprimer</button></td>
    </tr>`).join('');

  const select = document.getElementById('serial-product-select');
  select.innerHTML = products.map(p => `<option value="${p.id}">${p.sku} — ${p.name}</option>`).join('');
}

document.getElementById('product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await api('/products', { method: 'POST', body: JSON.stringify({
      sku: f.get('sku'),
      name: f.get('name'),
      requires_serial: f.get('requires_serial') === 'on',
      detection_pattern: f.get('detection_pattern') || null,
      pennylane_product_id: f.get('pennylane_product_id') ? Number(f.get('pennylane_product_id')) : null,
    })});
    e.target.reset();
    showMsg('Produit créé', 'ok');
    await loadProducts();
  } catch (err) { showMsg(err.message, 'error'); }
});

document.getElementById('product-table').addEventListener('click', async (e) => {
  if (e.target.dataset.action === 'delete-product') {
    try {
      await api(`/products/${e.target.dataset.id}`, { method: 'DELETE' });
      showMsg('Produit supprimé', 'ok');
      await loadProducts();
    } catch (err) { showMsg(err.message, 'error'); }
  }
});

async function loadSerials() {
  const serials = await api('/serial-numbers');
  const table = document.getElementById('serial-table');
  table.innerHTML = `<tr><th>Valeur</th><th>Produit</th><th>Statut</th><th>Assigné à</th><th></th></tr>` +
    serials.map(s => {
      const product = products.find(p => p.id === s.product_id);
      return `<tr>
        <td>${s.value}</td><td>${product ? product.sku : s.product_id}</td><td>${s.status}</td>
        <td>${s.assigned_to ?? ''}</td>
        <td><button class="danger" data-id="${s.id}" data-action="delete-serial">Supprimer</button></td>
      </tr>`;
    }).join('');
}

document.getElementById('serial-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await api('/serial-numbers', { method: 'POST', body: JSON.stringify({
      product_id: f.get('product_id'),
      value: f.get('value'),
    })});
    e.target.reset();
    showMsg('S/N créé', 'ok');
    await loadSerials();
  } catch (err) { showMsg(err.message, 'error'); }
});

document.getElementById('serial-table').addEventListener('click', async (e) => {
  if (e.target.dataset.action === 'delete-serial') {
    try {
      await api(`/serial-numbers/${e.target.dataset.id}`, { method: 'DELETE' });
      showMsg('S/N supprimé', 'ok');
      await loadSerials();
    } catch (err) { showMsg(err.message, 'error'); }
  }
});

document.getElementById('detect-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const result = document.getElementById('detect-result');
  try {
    const matches = await api('/serial-numbers/detect', { method: 'POST', body: JSON.stringify({ value: f.get('value') }) });
    result.textContent = matches.length
      ? 'Produit(s) détecté(s) : ' + matches.map(p => p.sku).join(', ')
      : 'Aucun produit ne correspond';
  } catch (err) { showMsg(err.message, 'error'); }
});

async function loadShipments() {
  const shipments = await api('/shipments');
  const table = document.getElementById('shipment-table');
  table.innerHTML = `<tr><th>Facture</th><th>Client</th><th>Statut</th><th></th></tr>` +
    shipments.map(s => `<tr>
      <td>${s.invoice_number}</td><td>${s.customer_name}</td><td>${s.status}</td>
      <td><button class="secondary" data-id="${s.id}" data-action="view-shipment">Détail</button></td>
    </tr>`).join('');
}

document.getElementById('shipment-table').addEventListener('click', async (e) => {
  if (e.target.dataset.action === 'view-shipment') {
    await showShipmentDetail(e.target.dataset.id);
  }
});

async function showShipmentDetail(id) {
  const { shipment, lines } = await api(`/shipments/${id}`);
  const serials = await api('/serial-numbers?status=in_stock');
  const detail = document.getElementById('shipment-detail');
  detail.innerHTML = `
    <h3>${shipment.invoice_number} — ${shipment.customer_name}</h3>
    <p>${shipment.delivery_address}, ${shipment.delivery_postal_code} ${shipment.delivery_city} (${shipment.delivery_country})</p>
    <label>Statut
      <select id="status-select">
        ${['pending','ready','labeled','shipped'].map(st => `<option value="${st}" ${st === shipment.status ? 'selected' : ''}>${st}</option>`).join('')}
      </select>
    </label>
    <table><tr><th>Article</th><th>Qté</th><th>S/N lié</th><th></th></tr>
      ${lines.map(l => {
        const options = serials.filter(sn => sn.product_id === l.product_id)
          .map(sn => `<option value="${sn.id}">${sn.value}</option>`).join('');
        return `<tr>
          <td>${l.label}</td><td>${l.quantity}</td><td>${l.product_id ? '' : '(produit non reconnu)'}</td>
          <td>${options ? `<select data-line="${l.id}" class="sn-select"><option value="">— choisir —</option>${options}</select>
            <button class="secondary" data-line="${l.id}" data-action="link-serial">Lier</button>` : '—'}</td>
        </tr>`;
      }).join('')}
    </table>
  `;
  document.getElementById('status-select').addEventListener('change', async (e) => {
    try {
      await api(`/shipments/${id}/status`, { method: 'PUT', body: JSON.stringify({ status: e.target.value }) });
      showMsg('Statut mis à jour', 'ok');
      await loadShipments();
    } catch (err) { showMsg(err.message, 'error'); }
  });
  detail.querySelectorAll('[data-action="link-serial"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const lineId = btn.dataset.line;
      const select = detail.querySelector(`.sn-select[data-line="${lineId}"]`);
      if (!select.value) return;
      try {
        await api(`/shipment-lines/${lineId}/link-serial-number`, { method: 'POST', body: JSON.stringify({ serial_number_id: select.value }) });
        showMsg('S/N lié à la ligne', 'ok');
        await showShipmentDetail(id);
      } catch (err) { showMsg(err.message, 'error'); }
    });
  });
}

document.getElementById('sync-btn').addEventListener('click', async () => {
  try {
    const result = await api('/pennylane/sync', { method: 'POST' });
    showMsg(`${result.invoices_processed} facture(s) traitée(s)`, 'ok');
    await loadShipments();
  } catch (err) { showMsg(err.message, 'error'); }
});

(async function init() {
  await loadProducts();
  await loadSerials();
  await loadShipments();
})();
</script>
</body>
</html>
